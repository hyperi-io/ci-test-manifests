#
# Generic container + k8s + IaC linting fixture. Unlinked from scalo /
# HyperI libs on purpose - a plain stdlib Python app whose only reason to
# exist is exercising hyperi-ci's two linting paths:
#   Path A - hadolint gate + droast advisory over the Dockerfile, run by
#            `hyperi-ci run quality`.
#   Path B - kubeconform gate + kube-linter/checkov advisories over the
#            Helm chart, plain manifests and .tf, run by
#            `hyperi-ci lint-manifests .`.
#
# build + publish are OFF: this fixture validates linting, not the release
# pipeline, so nothing ships.

language: python

quality:
  enabled: true

test:
  enabled: true
  coverage: false

build:
  enabled: false

release:
  # NO PUBLIC REGISTRY UPLOAD. Every ci-test fixture carries this.
  #
  # `enabled: false` used to be the whole block here and it did NOTHING --
  # hyperi-ci did not read that key then (hyperi-io/hyperi-ci#79). This repo has a
  # pyproject.toml and a VERSION file, and `language: python` routes straight
  # from `destination_for("python")` to `uv publish` with nothing in between, so it
  # was one credential away from PyPI the whole time.
  #
  # A falsy destination is the opt-out that works. Everything up to the upload
  # still runs and is still under test.
  enabled: true
  destinations:
    python: false
